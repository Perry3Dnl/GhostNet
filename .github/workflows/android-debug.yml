name: Build Android Debug APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android-app/**'
      - '.github/workflows/android-debug.yml'

permissions:
  contents: read

concurrency:
  group: ghostnet-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build GHOSTNET debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    defaults:
      run:
        working-directory: android-app

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Capacitor Android project
        run: npm run android:init

      - name: Run game integration smoke tests
        run: npm test

      - name: Build unsigned-for-Play debug APK
        run: |
          chmod +x android/gradlew
          npm run android:build

      - name: Upload APK and Gradle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghostnet-android-debug-${{ github.run_number }}
          path: |
            android-app/android/app/build/outputs/apk/debug/*.apk
            android-app/android/app/build/reports/**
          if-no-files-found: warn
          retention-days: 14
