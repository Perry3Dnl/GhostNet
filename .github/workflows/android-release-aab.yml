name: Build signed Android App Bundle (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    name: Signed AAB for Play internal testing
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android-app
    steps:
      - uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Check signing setup
        shell: bash
        env:
          UPLOAD_KEYSTORE_BASE64: ${{ secrets.GHOSTNET_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_KEY_ALIAS: ${{ secrets.GHOSTNET_UPLOAD_KEY_ALIAS }}
          UPLOAD_STORE_PASSWORD: ${{ secrets.GHOSTNET_UPLOAD_STORE_PASSWORD }}
          UPLOAD_KEY_PASSWORD: ${{ secrets.GHOSTNET_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$UPLOAD_KEYSTORE_BASE64" || { echo "Missing GHOSTNET_UPLOAD_KEYSTORE_BASE64 secret"; exit 1; }
          test -n "$UPLOAD_KEY_ALIAS" || { echo "Missing GHOSTNET_UPLOAD_KEY_ALIAS secret"; exit 1; }
          test -n "$UPLOAD_STORE_PASSWORD" || { echo "Missing GHOSTNET_UPLOAD_STORE_PASSWORD secret"; exit 1; }
          test -n "$UPLOAD_KEY_PASSWORD" || { echo "Missing GHOSTNET_UPLOAD_KEY_PASSWORD secret"; exit 1; }
          printf '%s' "$UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ghostnet-upload.jks"
          test -s "$RUNNER_TEMP/ghostnet-upload.jks"
          chmod 600 "$RUNNER_TEMP/ghostnet-upload.jks"

      - name: Generate Android project
        run: npm run android:init

      - name: Test game source
        run: npm test

      - name: Configure signing
        env:
          GHOSTNET_KEYSTORE_PATH: ${{ runner.temp }}/ghostnet-upload.jks
          GHOSTNET_KEY_ALIAS: ${{ secrets.GHOSTNET_UPLOAD_KEY_ALIAS }}
          GHOSTNET_STORE_PASSWORD: ${{ secrets.GHOSTNET_UPLOAD_STORE_PASSWORD }}
          GHOSTNET_KEY_PASSWORD: ${{ secrets.GHOSTNET_UPLOAD_KEY_PASSWORD }}
        run: python3 scripts/configure-release-signing.py

      - name: Build release app bundle
        env:
          GHOSTNET_KEYSTORE_PATH: ${{ runner.temp }}/ghostnet-upload.jks
          GHOSTNET_KEY_ALIAS: ${{ secrets.GHOSTNET_UPLOAD_KEY_ALIAS }}
          GHOSTNET_STORE_PASSWORD: ${{ secrets.GHOSTNET_UPLOAD_STORE_PASSWORD }}
          GHOSTNET_KEY_PASSWORD: ${{ secrets.GHOSTNET_UPLOAD_KEY_PASSWORD }}
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew --no-daemon bundleRelease

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: ghostnet-signed-aab-${{ github.run_number }}
          path: android-app/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
          retention-days: 14

      - name: Remove ephemeral keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ghostnet-upload.jks"
