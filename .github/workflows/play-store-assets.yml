name: Generate Google Play listing assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'play-store/assets/**'
      - '.github/workflows/play-store-assets.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image render dependencies
        run: pip install cairosvg pillow

      - name: Render icon and feature graphic
        run: python3 play-store/assets/render-assets.py

      - name: Upload listing PNG assets
        uses: actions/upload-artifact@v4
        with:
          name: ghostnet-google-play-artwork
          path: play-store/assets/generated/*.png
          if-no-files-found: error
          retention-days: 30
