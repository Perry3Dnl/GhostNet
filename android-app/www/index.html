/* At capped Tier 10 speed, resolve uniform guaranteed-success breaches as
   one batch. Recruitment remains sampled; detection and mission thresholds
   are checked before entering the fast path. */
function fastBatch(n,d){
 if(n<=0)return;
 let t=s.target,tier=s.tier;
 let unit=reward(t);
 let total=unit*n;
 s.btc+=total;s.earned+=total;s.lifetime+=total;
 s.breaches+=n;s.intel.totalBreaches+=n;pending.n+=n;pending.btc+=total;applyTierSuccess(t,tier,n,unit);
 let count=s.tierBreaches[tier-1]||0;
 s.tierBreaches[tier-1]=count+n;
 if(stars(tier)>starsNeeded.filter(x=>count>=x).length)log('[MASTERY] T'+tier+' ★'+stars(tier));
 for(const o of Ops){
  if(o[2]!==tier||done(o[0]))continue;
  s.ops[o[0]]=Math.min(o[3],(s.ops[o[0]]||0)+n);
  if(s.ops[o[0]]>=o[3]){s.opsDone[o[0]]=true;log('[CLASSIFIED] '+o[1]+' COMPLETE')}
 }
 let chance=recruit(t),hits=0;
 if(n<300){for(let i=0;i<n;i++)if(Math.random()<chance)hits++}
 else{
  let u1=Math.max(1e-12,Math.random()),u2=Math.random(),z=Math.sqrt(-2*Math.log(u1))*Math.cos(2*Math.PI*u2);
  hits=Math.max(0,Math.min(n,Math.round(n*chance+z*Math.sqrt(n*chance*(1-chance)))));
 }
 let joined=hits*(has('duplicate')?2:1)+randHits(hits,.05*abilityRank('worm'));
 s.hosts+=joined;s.hpower+=joined*t.host;pending.hosts+=joined;
 contractProgress('breach',n,tier);
 if(joined)contractProgress('recruit',joined,tier);
 unlock();checkAch();
 if(!s.rare&&s.breaches>=15&&now()-s.rareLast>=60000&&Math.random()<1-Math.pow(.98,n)){
  s.rare={type:Math.random()<.7?'wallet':'hosts',until:now()+30000};s.rareLast=now();log('[RARE] Unusual cache detected');
 }
 s.seq+=Math.max(0,n-1);spawn();
}
function tick(dt){
 simDebt=Math.min(simDebt+dt,600);
 let iterations=0;
 while(simDebt>1e-9&&iterations++<240){
  if(!s.target)spawn();
  let d=duration(),r=Math.max(1e-12,detect(s.target));
  if(s.tier===10&&s.unlocked===10&&d<=.45000001&&s.progress===0&&s.trace===0&&r*d<100&&simDebt>24*d){
   let n=Math.min(100000,Math.floor(simDebt/d));fastBatch(n,d);simDebt-=n*d;continue;
  }
  let tb=Math.max(0,(1-s.progress)*d),td=Math.max(0,(100-s.trace)/r),step=Math.min(simDebt,tb,td);
  if(step<1e-10){finish(tb<=td);continue}
  s.progress+=step/d;s.trace+=step*r;simDebt-=step;
  if(step>=Math.min(tb,td)-1e-9)finish(tb<=td);
 }
}

 if(d.tierBreaches&&(!Array.isArray(d.tierBreaches)||d.tierBreaches.length>10||d.tierBreaches.some(n=>!Number.isSafeInteger(n)||n<0)))throw Error('Invalid tier mastery');
 if(d.intel&&(!d.intel.unlockedAwards||typeof d.intel.unlockedAwards!=='object'))throw Error('Invalid achievement archive');
